[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelclaw"
version = "1.0.0"
description = "Cross-language web novel translation toolkit — transmittor-pipeline with validation, glossary management, and reader UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "P Choke & Mika"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/ChokechaiXD/NovelClaw"
Documentation = "https://github.com/ChokechaiXD/NovelClaw"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["tools"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 60
