<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#eef1f4" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="ห้องอ่านและสตูดิโอแปลนิยายแบบ local-first สำหรับใช้งานในวง LAN" />
  <title>NovelClaw · ห้องอ่าน</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="apple-mobile-web-app-title" content="NovelClaw" />
  <link rel="stylesheet" href="/design-system.css" />
</head>
<body data-theme="paper">
  <a class="c-skip-link" href="#main-content">ข้ามไปยังเนื้อหา</a>
  <!-- SVG Symbols -->
  <svg class="u-hidden">
    <symbol id="brand-mark" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="var(--brand-ink, #172033)"/>
      <path d="M12 17.5c7.8-1.1 14.3.8 20 5.7v28.1c-5.9-4-12.6-5.6-20-4.2V17.5Z" fill="var(--brand-paper, #fff)"/>
      <path d="M52 17.5c-7.8-1.1-14.3.8-20 5.7v28.1c5.9-4 12.6-5.6 20-4.2V17.5Z" fill="var(--brand-paper-soft, #eef1ff)"/>
      <path d="M32 23.2c5.7-4.9 12.2-6.8 20-5.7v5.4c-7.6-1.1-14.2 1-20 6.2v-5.9Z" fill="var(--brand-accent, #7d8eeb)"/>
      <path d="m40 31 9-3.4M40 38l9-3.4M40 45l7-2.6" fill="none" stroke="var(--brand-ink, #172033)" stroke-width="2.4" stroke-linecap="round" opacity=".58"/>
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-library" viewBox="0 0 24 24"><path d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2l7 4v5c0 5-3.5 9.7-7 11-3.5-1.3-7-6-7-11V6l7-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-hamburger" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5v-15z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-bookmarks" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v16l-7-5-7 5V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <!-- ═══ LAYOUT ═══ -->
  <div class="c-app" id="app-layout">
    <!-- Desktop masthead -->
    <header class="c-app__sidebar" id="sidebar-nav">
      <a class="c-sidebar__brand" href="#home" data-nav aria-label="NovelClaw หน้าหลัก">
        <span class="c-sidebar__logo" aria-hidden="true">
          <svg><use href="#brand-mark"/></svg>
        </span>
        <div class="c-sidebar__brand-text">
          <div class="c-sidebar__title">NovelClaw</div>
          <div class="c-sidebar__subtitle">ห้องอ่าน · สตูดิโอแปล</div>
        </div>
      </a>

      <nav class="c-sidebar__nav" aria-label="ห้องอ่าน">
        <a class="c-nav-item c-nav-item--active" data-page="home" href="#home" data-nav aria-current="page">หน้าหลัก</a>
        <a class="c-nav-item" data-page="library" href="#library" data-nav>คลังนิยาย</a>
        <a class="c-nav-item" data-page="search" href="#search" data-nav>ค้นหา</a>
        <a class="c-nav-item" data-page="history" href="#history" data-nav>อ่านล่าสุด</a>
      </nav>

      <div class="c-sidebar__tools">
        <a class="c-nav-item c-nav-item--studio" data-page="admin" href="#admin" data-nav>
          <svg class="c-nav-item__icon" aria-hidden="true"><use href="#icon-shield"/></svg><span>สตูดิโอ</span>
        </a>
        <a class="c-nav-item c-nav-item--icon-only" data-page="settings" href="#settings" data-nav aria-label="ตั้งค่า" title="ตั้งค่า">
          <svg class="c-nav-item__icon" aria-hidden="true"><use href="#icon-settings"/></svg>
        </a>
        <button class="c-toggle" id="theme-toggle-new" data-theme-toggle type="button" role="switch" aria-checked="false" aria-label="เปิดหรือปิดโหมดกลางคืน"></button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="c-app__main" id="main-content" tabindex="-1">
      <div class="c-header">
        <div class="c-header__left">
          <button class="c-btn c-btn--icon" id="sidebar-toggle" aria-label="เปิดเครื่องมือ" aria-controls="drawer-sidebar" aria-expanded="false" type="button">
            <svg class="c-icon c-icon--sm" aria-hidden="true"><use xlink:href="#icon-hamburger"/></svg>
          </button>
          <span class="c-header__title" id="page-title">หน้าหลัก</span>
        </div>
        <a class="c-header__studio" href="#admin" data-nav>สตูดิโอ</a>
      </div>

      <div class="c-content">
        <div class="page page--active" id="page-home"></div>
        <div class="page" id="page-novel-detail"></div>
        <div class="page" id="page-reader"></div>
        <div class="page" id="page-library"></div>
        <div class="page" id="page-search"></div>
        <div class="page" id="page-history"></div>
        <div class="page" id="page-bookmarks"></div>
        <div class="page" id="page-settings"></div>
        <div class="page" id="page-admin"></div>
        <div class="page" id="page-admin-novels"></div>
        <div class="page" id="page-admin-chapters"></div>
        <div class="page" id="page-admin-novel-edit"></div>
        <div class="page" id="page-admin-logs"></div>
        <div class="page" id="page-admin-glossary"></div>
        <div class="page" id="page-admin-import"></div>
        <div class="page" id="page-admin-translate"></div>
        <div class="page" id="page-admin-provider"></div>
      </div>
    </main>

  </div>

  <!-- Mobile drawer overlay -->
  <div class="c-drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>

  <!-- Mobile utility drawer -->
  <div class="c-drawer" id="drawer-sidebar" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="c-sidebar__brand">
      <div class="c-sidebar__logo"><svg><use href="#brand-mark"/></svg></div>
      <div class="c-sidebar__brand-text">
        <div class="c-sidebar__title" id="drawer-title">NovelClaw</div>
        <div class="c-sidebar__subtitle">เครื่องมือในเครื่องนี้</div>
      </div>
      <button class="c-btn c-btn--icon" id="drawer-close" aria-label="ปิดเมนู" type="button">
        <svg class="c-icon c-icon--xs" aria-hidden="true"><use xlink:href="#icon-close"/></svg>
      </button>
    </div>
    <nav class="c-sidebar__nav" id="drawer-nav" aria-label="เครื่องมือมือถือ">
      <a class="c-nav-item" data-page="admin" href="#admin" data-nav>
        <svg class="c-nav-item__icon" aria-hidden="true"><use href="#icon-shield"/></svg> สตูดิโอแปล
      </a>
      <a class="c-nav-item" data-page="settings" href="#settings" data-nav aria-label="ตั้งค่า">
        <svg class="c-nav-item__icon" aria-hidden="true"><use href="#icon-settings"/></svg> ตั้งค่าการอ่าน
      </a>
    </nav>
    <div class="c-sidebar__toggles">
      <div class="c-toggle__row">
        <span class="c-toggle__label"><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="#icon-moon"/></svg>โหมดกลางคืน</span>
        <button class="c-toggle" id="drawer-theme-toggle" data-theme-toggle type="button" role="switch" aria-checked="false" aria-label="เปิดหรือปิดโหมดกลางคืน"></button>
      </div>
    </div>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="c-mobile-nav" id="mobile-nav" aria-label="ห้องอ่าน">
    <a class="c-mobile-nav__item c-mobile-nav__item--active" data-page="home" href="#home" data-nav aria-current="page" aria-label="หน้าหลัก">
      <svg aria-hidden="true"><use xlink:href="#icon-home"/></svg>หน้าแรก
    </a>
    <a class="c-mobile-nav__item" data-page="library" href="#library" data-nav aria-label="คลังนิยาย">
      <svg aria-hidden="true"><use xlink:href="#icon-library"/></svg>หอสมุด
    </a>
    <a class="c-mobile-nav__item" data-page="search" href="#search" data-nav aria-label="ค้นหา">
      <svg aria-hidden="true"><use xlink:href="#icon-search"/></svg>ค้นหา
    </a>
    <a class="c-mobile-nav__item" data-page="history" href="#history" data-nav aria-label="อ่านล่าสุด">
      <svg aria-hidden="true"><use xlink:href="#icon-history"/></svg>ล่าสุด
    </a>
  </nav>

  <div id="toast-container" class="c-toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ═══ SCRIPTS (order matters) ═══ -->
  <!-- Defer non-critical scripts; admin routes load only when opened. -->
  <script src="/js/state.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/pages/home.js" defer></script>
  <script src="/js/pages/novel.js" defer></script>
  <script src="/js/reader-renderer.js" defer></script>
  <script src="/js/pages/reader.js" defer></script>
  <script src="/js/pages/bookmarks.js" defer></script>
  <script src="/js/pages/pages.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
